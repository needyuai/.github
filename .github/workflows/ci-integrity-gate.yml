# Gate de integridade do controle — caller.
#
# A lógica vive na composite action `trustyu-infra/.github/actions/ci-integrity-gate`.
# NÃO edite regra aqui: edite a action, e todos os consumidores herdam.
#
# O NOME DO JOB É CONTRATO. Ele vira o nome do status check exigido pelo ruleset
# (`Revisão humana em CI e governança`). Renomear quebra o `required_status_checks` —
# o PR passa a ficar BLOCKED com tudo verde, padrão `gate-morto` que o auditor detecta.
#
# Ref: ADR-0067 · ADR-0081 (I4) · trustyu-docs/docs/governance/security-posture-review-2026-08.md §3.7

name: CI integrity gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-integrity-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  human-approval:
    name: Revisão humana em CI e governança
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir revisão humana
        uses: needyuai/trustyu-infra/.github/actions/ci-integrity-gate@ba376e5bfbae7be157d8a5b0c70ec60b40806761
